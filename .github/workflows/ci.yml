# ============================================================
# CONTROLPANEL — Continuous Integration
#
# Triggered on every push to main and every pull request
# targeting main.
#
# Job graph:
#   lint ──┐
#          ├─► build ──► docker
#   type ──┘
#
# test runs in parallel with build/docker (continue-on-error)
# because Vitest setup is maintained by the QA team.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Disable Next.js telemetry in CI
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ──────────────────────────────────────────────
  # Job: lint
  # Runs ESLint via `npm run lint` (next lint)
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ──────────────────────────────────────────────
  # Job: typecheck
  # Runs the TypeScript compiler with --noEmit to
  # surface type errors without producing output.
  # Runs in parallel with lint.
  # ──────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────
  # Job: build
  # Runs `npm run build` (next build).
  # Depends on lint and typecheck succeeding first
  # so we catch cheap errors before spending minutes
  # on the full webpack compilation.
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        # better-sqlite3 requires native compilation; npm ci handles this
        # via its prebuilt binary download on Linux x64.
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      # Cache the standalone build output for the docker job below.
      # Using a unique key per commit SHA avoids stale artifacts.
      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-standalone-${{ github.sha }}
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 1

  # ──────────────────────────────────────────────
  # Job: test
  # Runs the Vitest test suite.
  # continue-on-error: true because the QA team is
  # still wiring up the full test infrastructure.
  # This job will not block merges until it is stable.
  # ──────────────────────────────────────────────
  test:
    name: Test (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose
        env:
          CI: "true"

  # ──────────────────────────────────────────────
  # Job: docker
  # Builds the Docker image to verify the
  # Dockerfile is syntactically correct and the
  # multi-stage build completes without error.
  # Does NOT push to a registry in CI — only build.
  # Depends on the build job succeeding.
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Docker Buildx for multi-platform and cache support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Push is disabled — this job only validates the build
          push: false
          tags: controlpanel:${{ github.sha }}
          # Cache layers between workflow runs to speed up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
