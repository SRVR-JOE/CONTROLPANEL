# ============================================================
# CONTROLPANEL — Release Pipeline
#
# Triggered on version tags matching v* (e.g. v1.0.0, v2.3.1).
# Builds the Docker image and pushes it to GitHub Container
# Registry (ghcr.io) with both the version tag and 'latest'.
#
# Required repository secrets: none (uses GITHUB_TOKEN)
# Required repository permissions:
#   packages: write  (to push to ghcr.io)
#   contents: read   (to checkout code)
#
# To trigger a release:
#   git tag v1.2.3
#   git push origin v1.2.3
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  # Image name: ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ──────────────────────────────────────────────
  # Job: release
  # Build + push multi-architecture Docker image
  # to GitHub Container Registry on every v* tag.
  # ──────────────────────────────────────────────
  release:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    # Required for GITHUB_TOKEN to push packages
    permissions:
      contents: read
      packages: write
      # Required for image provenance attestations (SLSA)
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for multi-architecture builds (arm64 + amd64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx provides advanced build features: cache, multi-platform
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to ghcr.io using the built-in GITHUB_TOKEN.
      # No additional secrets are required.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate OCI-compliant image metadata (tags, labels).
      # This action extracts the version from the git tag and creates:
      #   - ghcr.io/<owner>/<repo>:v1.2.3   (exact version)
      #   - ghcr.io/<owner>/<repo>:latest    (latest release)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with the full semver string from the git tag (e.g. v1.2.3)
            type=semver,pattern={{version}}
            # Tag with major.minor (e.g. 1.2)
            type=semver,pattern={{major}}.{{minor}}
            # Tag with major only (e.g. 1)
            type=semver,pattern={{major}}
            # Always update 'latest'
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=CONTROLPANEL
            org.opencontainers.image.description=AV Rack Control Panel — Disguise Server Config
            org.opencontainers.image.vendor=CONTROLPANEL Project

      # Build and push for linux/amd64 and linux/arm64.
      # arm64 support ensures the image runs on Apple Silicon
      # (M-series) Macs and ARM-based cloud instances.
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer caching via GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build provenance attestation (SLSA level 2)
          provenance: true
          sbom: true

      # Print the image digest for traceability in the workflow log
      - name: Output image digest
        run: |
          echo "Image pushed successfully"
          echo "Digest: ${{ steps.build-push.outputs.digest }}"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/  /'
